services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: probstreet-primary-database
    restart: always
    environment:
      POSTGRES_USER: probstreet
      POSTGRES_PASSWORD: probstreetadmin
      POSTGRES_DB: primary-database
    ports:
      - '5432:5432'
    volumes:
      - probstreet_primary_database_data:/var/lib/postgresql/data

  redis-cache:
    image: redis:7.2
    container_name: probstreet-redis-cache
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - '6379:6379'
    volumes:
      - redis-cache-data:/data

  redis-pubsub:
    image: redis:7.2
    container_name: probstreet-redis-pubsub
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - '6380:6379'
    volumes:
      - redis-pubsub-data:/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - '2181:2181'

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - '9092:9092'
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

volumes:
  probstreet_primary_database_data:
  redis-cache-data:
  redis-pubsub-data:
