name: Prettier Auto-Format

on:
  push:
    branches:
      - main
      - staging
      - production

jobs:
  format:
    name: Run Prettier
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.17

      - name: Install dependencies
        run: bun install

      - name: Run Prettier
        run: bun run format

      - name: Commit formatting changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'style: auto format code with Prettier [skip ci]'
          branch: ${{ github.ref }}
